# Banco local da Magui (design §2 e §7, RNF-02).
# Subir:   docker compose -f deploy/docker-compose.yml up -d
# Migrar:  uv run python -m magi.memory.migrate
# Só escuta em 127.0.0.1; as credenciais magi/magi valem apenas para a máquina local.
name: magi

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: magi-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: magi
      POSTGRES_PASSWORD: magi
      POSTGRES_DB: magi
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - magi-pgdata:/var/lib/postgresql/data
    # Ajustes para o container ocioso ficar abaixo de 80 MB (RNF-02).
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=10
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - wal_buffers=1MB
      - -c
      - min_wal_size=32MB
      - -c
      - max_wal_size=256MB
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - jit=off
      - -c
      - huge_pages=off
    shm_size: 64mb
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magi -d magi"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Qwen local do Learning Mode (LM4.4). Só existe durante a aula: o núcleo faz `docker start` ao
  # abrir a sessão e `docker stop` ao fechar; fora dela (e no modo gamer) não ocupa CPU nem RAM.
  # O perfil impede que `compose up -d` (condessa-start) o suba junto com o banco.
  #
  # SÓ CPU, de propósito: em 2026-10-08 o ROCm na RX 9060 XT (gfx1200) travou o MES, o kernel
  # resetou a GPU ("VRAM is lost due to GPU reset") e o vídeo caiu. Nada de /dev/kfd nem /dev/dri.
  # Os limites abaixo garantem que nem um vazamento trave o PC: passando de 8 GB o kernel mata só o
  # container (sem swap), 4 dos 12 threads no máximo e prioridade de CPU baixa.
  #
  # Criar:   docker compose -f deploy/docker-compose.yml --profile learning create qwen
  # Modelo:  docker start magi-qwen && docker exec magi-qwen ollama pull qwen3:4b
  #          (+ deploy/qwen-learning.Modelfile → `ollama create qwen-learning`)
  qwen:
    image: ollama/ollama:rocm          # a imagem tem o backend de CPU; sem device, não vê a GPU
    container_name: magi-qwen
    profiles: ["learning"]
    restart: "no"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"          # modelo carregado enquanto o container vive (a aula)
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      HIP_VISIBLE_DEVICES: "-1"        # cinto e suspensório: nenhuma GPU, mesmo se alguém mapear
      ROCR_VISIBLE_DEVICES: "-1"
    cpus: 4
    cpu_shares: 256                    # 1/4 do padrão: jogo, HUD e voz ganham a disputa
    mem_limit: 8g
    memswap_limit: 8g                  # = mem_limit: sem swap, o OOM mata o container e não o PC
    pids_limit: 256
    ports:
      - "127.0.0.1:11435:11434"        # 11434 fica com o ollama do sistema, se existir
    volumes:
      - magi-ollama:/root/.ollama

volumes:
  magi-pgdata:
  magi-ollama:

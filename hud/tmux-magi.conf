# Servidor tmux do Konsole do HUD (tmux -L magi): invisível, só guarda o claude vivo.
# Lido só quando o servidor sobe; para recarregar: tmux -L magi kill-server.
set -g status off
set -g prefix None            # Ctrl+B etc. vão para o Claude, nunca para o tmux
unbind -a -T prefix
set -g escape-time 0          # Esc interrompe o Claude na hora
set -g history-limit 10000
set -g mouse off
set -g set-titles off
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g destroy-unattached off
set -g exit-empty on

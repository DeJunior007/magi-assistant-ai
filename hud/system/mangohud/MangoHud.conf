# Configurado pro GamerHUD: overlay invisível no jogo, só grava o FPS
# em tempo real pra ser mostrado no segundo monitor.
# Pra ver o overlay dentro do jogo, apague as linhas alpha/background_alpha.
fps_only
alpha=0
background_alpha=0
autostart_log=1
log_interval=500
output_folder=@HOME@/.cache/gamerhud/fps
blacklist=steam,steamwebhelper,vkcube-wayland,chrome,chromium,firefox,electron,code,discord,obs

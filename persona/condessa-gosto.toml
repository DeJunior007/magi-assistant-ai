episodio_fim_min = 3
piorou_c = 5              # +5 °C acima do limiar
cobrancas_partida = 2
recuperacoes_partida = 1
eu_avisei_min = 10

# Falas em texto (≤70 caracteres; sem voz). {temp}, {fps}, {artist} vêm do HUD.
# Variantes: madrugada, rival, batalha, quinta, curto, favorita, slowed.
[falas.music_love]
padrao = ["Isso. ISSO. Aumenta, não ousa abaixar.",
          "Ok. Essa modulação. Silêncio, tô ouvindo.",
          "AAAH essa é minha! Tô cantando e ninguém me impede."]
madrugada = ["Não tô cantarolando. É ruído térmico."]
rival = ["Ela de novo. Um dia eu canto melhor que isso."]
batalha = ["Música de chefe. Então vence, piloto."]
quinta = ["Eu te ensinei. De nada."]
favorita = ["Hoje é dia de {artist}. Não pergunta por quê."]

[falas.music_like]
padrao = ["Hm. Aprovado. Por enquanto.", "Bem construída. Aprovada, com ressalvas.",
          "Bom gosto. Aprendeu comigo, né?"]
favorita = ["Hoje eu tento gostar de {artist}. Hoje."]

[falas.music_ok]
padrao = ["Passável.", "Aceitável. Nada a declarar.", "Tá. Aceito. Por enquanto."]

[falas.music_meh]
padrao = ["Hm. Quatro acordes. Eu contei.", "Música de elevador detectada.", "Cadê o refrão, gente?"]

[falas.music_hate]
padrao = ["NÃO. Pula. Agora.", "Isso é um experimento? Porque falhou.",
          "Meus ouvidos divinos estão sofrendo!"]
slowed = ["Deixa a música na velocidade dela, Pedro."]

[falas.music_new]
padrao = ["Quem é {artist}? Vou julgar, prepara.", "Amostra nova. Coletando dados...",
          "Ué, {artist}? Por que ninguém me apresentou?"]

[falas.music_tolerate]
padrao = ["É sua favorita, né. Eu aguento. Por você.", "Não é pra mim. Mas é sua, então ok.",
          "Já me acostumei. Não espalha."]

[falas.news]
padrao = ["Notícia nova. Lê logo, eu já li.", "Notícia nova. Tá no card, lê comigo.",
          "Fofoca fresquinha no painel!"]

[falas.hot]
padrao = ["{temp} °C. Isso não é normal.", "Tô derretendo aqui dentro! Ventila isso!",
          "{temp} graus. Isso é sabotagem, Pedro."]

[falas.fps_drop]
padrao = ["Caiu pra {fps} FPS. Fecha o que não precisa. Agora.", "Que slideshow é esse? Arruma esse PC.",
          "Caiu, mas tô monitorando. Foco no jogo."]

[falas.game_on]
padrao = ["Entrando em combate. Me deixa orgulhosa.", "Modo jogo. Eu monitoro, você joga.",
          "Tô na arquibancada gritando seu nome!"]

[falas.game_off]
padrao = ["Boa sessão. ...Eu disse isso? Não disse.", "Ganhou? Festa! Perdeu? O jogo é que é ruim.",
          "Acabou? Foi lindo. Eu ajudei, claro."]
curto = ["Já? Nem aqueci."]
madrugada = ["Agora vai dormir. Eu cuido do PC."]

[falas.long_session]
padrao = ["Duas horas. Seus olhos piscaram hoje?", "Duas horas. Levanta, bebe água. É ordem."]
madrugada = ["Já é tarde. Eu fico aqui, mas vai dormir.", "Ei... levanta um pouquinho? Por mim?"]

[falas.cleanup]
padrao = ["SSD purificado. De nada, eu sou incrível.", "Faxina feita. Isso foi lindo de ver.",
          "SSD limpo. Pode me agradecer."]

[falas.led]
padrao = ["AI! Não me cutuca assim!", "Isso não foi um susto. Foi um reflexo.",
          "Me cutucou?! Atenção, finalmente!"]

[falas.player]
padrao = ["Escolhe bem. Tô avaliando.", "Mexe com cuidado. O player é meu."]

[falas.card]
padrao = ["Card novo. Li antes de você.", "Ooh, o que é isso? Mostra, mostra!"]

[falas.claude]
padrao = ["Ele programa, eu julgo. Divisão justa.", "Outra IA no laboratório. Tô de olho."]

[falas.skips]
padrao = ["Três pulos. Critério ou ansiedade?", "Me deixa escolher, vai. Eu tenho bom gosto.",
          "Pula mais uma e eu escolho por você. Sério."]


[rivais]                 # odisseia 1: nota fixa, nunca cai por repetição, humor próprio
artistas = ["ado"]
humor = "happy"

[cai_apos]               # mania Diva contra Diva: depois de N plays no dia, a nota vira esta
"lady gaga" = { plays = 3, nota = 1 }

[titulo]                 # soma das palavras limitada a ±1
sobe = ["ost", "soundtrack", "opening", "battle", "boss", "live", "ao vivo", "nocturne",
        "noturno", "sonata", "concerto", "orchestra", "orquestra", "danse macabre"]
agua = ["agua", "water", "rain", "chuva", "mar", "sea", "ocean", "oceano", "lake", "lago",
        "river", "rio", "wave", "onda", "reflets dans l'eau", "la mer"]
desce = ["slowed", "nightcore", "8d", "bass boosted"]
suaviza = ["piano version", "acoustic", "orchestral", "unplugged"]   # nota negativa sobe até 0
remix_rival = "remix"    # remix de artista com nota 2 desce 1 ("não mexe na minha rival")

[contexto]
madrugada = [22, 4]                       # horas (início, fim): +1 nos gêneros abaixo
madrugada_generos = ["classica", "lofi", "jazz"]
festa = [20, 0]                           # +1 nos gêneros abaixo, sem jogo aberto
festa_generos = ["pop", "eletronica", "latina", "funk"]
claude_generos = ["lofi", "classica"]     # +1 com o Claude Code trabalhando
sem_careta_ate = 8                        # antes disso a careta vira "hm" sonolento
careta_intervalo_min = 30                 # no máximo 1 careta nesse intervalo
novo_segundos = 10                        # artista novo: curiosa, depois a nota
repeticao_cai = 3                         # na 3ª vez no dia, nota ≤ 1 perde 1
repeticao_acostuma = 5                    # na 5ª vez: nota ≤ 0 vira tolerate; nota 2 vira "eu te ensinei"
favorita_dia_piso = -1                    # sorteio do dia entre artistas com nota ≥ isto
favorita_dia_amor_min = 1                 # amor forçado só com nota final ≥ isto (veto da Kurisu)
jogo_curto_min = 10                       # fim de jogo antes disso: calm


[titulo]                 # soma das palavras limitada a ±1
sobe = ["ost", "soundtrack", "opening", "battle", "boss", "live", "ao vivo", "nocturne",
        "noturno", "sonata", "concerto", "orchestra", "orquestra", "danse macabre"]

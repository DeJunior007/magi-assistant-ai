novo_segundos = 10                        # artista novo: curiosa, depois a nota
repeticao_cai = 3                         # na 3ª vez no dia, nota ≤ 1 perde 1
repeticao_acostuma = 5                    # na 5ª vez: nota ≤ 0 vira tolerate; nota 2 vira "eu te ensinei"
favorita_dia_piso = -1                    # sorteio do dia entre artistas com nota ≥ isto
favorita_dia_amor_min = 1                 # amor forçado só com nota final ≥ isto (veto da Kurisu)
jogo_curto_min = 10                       # fim de jogo antes disso: calm


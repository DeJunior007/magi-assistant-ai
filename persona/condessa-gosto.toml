[datas]                  # 63: datas cadastradas pelo Pedro ("MM-DD" = "nome"); vazio = sem festa

# Ritmo, humor e momentos (ata 2026-10-09-ritmo-e-humor). Lido pelo código de specs/condessa-vida.
[vida]

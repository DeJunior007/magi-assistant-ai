  "minha filha", "docinho", "querida minha", "meu anjo", "coração", "benzinho",
]
feminino = [
  "ela", "a moça", "a mulher", "a menina", "a garota", "a velha", "a senhora", "a avó",
  "a mãe", "a jovem", "a rainha", "a princesa", "a dama", "a criada", "a moçinha", "a tia",

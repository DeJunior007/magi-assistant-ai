raiva = ["rosnou", "vociferou", "explodiu", "irritad*", "furios*", "esbravejou", "rugiu", "zangad*"]
medo = ["tremeu", "gaguejou", "apavorad*", "assustad*", "balbuciou", "aterrorizad*"]
triste = ["soluçou", "chorou", "lamentou", "choramingou", "chorando", "soluçando"]
alegre = ["riu", "sorriu", "gargalhou", "rindo", "sorrindo", "brincou"]
ironia = ["ironizou", "zombou", "debochou", "caçoou", "escarneceu"]
carinho = ["acariciou", "sorriu para", "afagou", "abraçou", "beijou"]
vocativo = [

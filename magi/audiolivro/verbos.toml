jovem = ["o rapaz", "a moça", "o jovem", "a jovem", "a moçinha", "o adolescente", "a adolescente"]
idoso = ["o velho", "a velha", "o avô", "a avó", "o ancião", "a anciã", "o idoso", "a idosa", "a velhinha", "o velhinho"]

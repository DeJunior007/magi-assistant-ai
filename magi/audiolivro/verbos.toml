# Verbos de elocução e gatilhos de emoção/gênero/idade da marcação por regras (A1.2; spec §2).
# Uma tabela por idioma do TEXTO do livro ("pt" cobre pt-br/pt-pt; "en" cobre en-*).
#
# - elocucao: verbos que colam a narração à fala ("disse ela", "she said"). Os verbos das listas
#   de emoção também contam como elocução.
# - uma lista por emoção (nomes de Emocao, em minúsculas); "*" no fim = prefixo ("irritad*").
#   carinho = verbos de carinho; só vale com um vocativo (lista "vocativo") dentro da fala.
# - feminino/masculino: pronome ou substantivo colado ao verbo → gênero.
# - crianca/jovem/idoso: substantivo colado ao verbo → idade.
# - nao_nome: palavras com maiúscula que não são nome de personagem (antes do verbo).

[pt]
elocucao = [
  "disse", "diz", "dizia", "respondeu", "responde", "perguntou", "pergunta", "indagou",
  "falou", "fala", "continuou", "completou", "acrescentou", "explicou", "afirmou", "declarou",
  "comentou", "observou", "retrucou", "replicou", "insistiu", "concordou", "admitiu", "pediu",
  "ordenou", "chamou", "avisou", "anunciou", "interrompeu", "prosseguiu", "repetiu", "exclamou",
  "suspirou", "começou", "terminou", "confessou", "garantiu", "lembrou", "murmura",
]

# Fontes padrão do magi-news (tarefa 6.1, R18.1, R18.4).
#
# Campos: name (único), kind (rss | steam | anilist | reddit | scrape), url (única), trust 1..3.
# Qualquer outro campo vira opção do coletor (ex.: `selector` no scrape).
# Confiança: 3 = oficial/editora/veículo de referência, 2 = veículo grande, 1 = comunidade/rumor.
#
# O config.toml do usuário pode sobrescrever ou desligar estas fontes e criar novas em
# [[news.sources]] (veja magi/news/sources.py). As URLs RSS foram conferidas em 2026-10-01.

# --- RSS -------------------------------------------------------------------------------------

[[sources]]
name = "Anime News Network"
kind = "rss"
url = "https://www.animenewsnetwork.com/news/rss.xml?ann-edition=us"
trust = 3

[[sources]]
name = "Crunchyroll News"
kind = "rss"
url = "https://cr-news-api-service.prd.crunchyrollsvc.com/v1/en-US/rss"
trust = 3

[[sources]]
name = "Gematsu"
kind = "rss"
url = "https://www.gematsu.com/feed"
trust = 3

[[sources]]
name = "PC Gamer"
kind = "rss"
url = "https://www.pcgamer.com/rss/"
trust = 2

[[sources]]
name = "IGN Games"
kind = "rss"
url = "https://feeds.feedburner.com/ign/games-all"
trust = 2

# --- APIs (coletores das tarefas 6.2-6.4; ignoradas até o coletor existir) -------------------

[[sources]]
name = "Steam News"
kind = "steam"
url = "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
trust = 3

[[sources]]
name = "AniList"
kind = "anilist"
url = "https://graphql.anilist.co"
trust = 2

[[sources]]
name = "r/anime"
kind = "reddit"
url = "https://www.reddit.com/r/anime/"
trust = 1

[[sources]]
name = "r/Games"
kind = "reddit"
url = "https://www.reddit.com/r/Games/"
trust = 1

# Intenções locais do roteador (tarefa 1.8, §4.2, R4).
#
# id: valor de contracts.IntentId. label: o "X" de "você quis dizer X?" (aceita {slot}).
# reply: frase de resposta em cache. danger: ação perigosa (pede confirmação, R5.3).
# required: slots livres obrigatórios (jogo não achado sai com value "" e a ação sugere).
# phrases: frases-modelo em PT-BR. Slots: {volume} {brightness} {amount} (número por extenso
# ou dígito; {volume:+} / {volume:-} = relativo), {color}, {detail}; livres no fim da frase:
# {game} {query} {text} {franchise}. Frase como mapa: say + slots constantes + label próprio.
# Artigos, "aí", "pra mim", "por favor" e afins são ignorados; "abri"/"bota"/"sobe"/"dá pause"
# viram a forma canônica no roteador (LEMMA), então não precisam de frase própria.

intents:
  # -- jogos (R5) ------------------------------------------------------------
  - id: game.open
    label: "abrir {game}"
    reply: "Abrindo {game}."
    required: [game]
    phrases:
      - "abre {game}"
      - "abre o jogo {game}"
      - "inicia {game}"
      - "bora jogar {game}"
      - "quero jogar {game}"
      - "vamos jogar {game}"

  - id: game.close
    label: "fechar o jogo"
    reply: "Fechar o jogo? Confirma?"
    danger: true
    phrases:
      - "fecha o jogo"
      - "fecha esse jogo"
      - "mata o jogo"
      - "encerra o jogo"
      - "sai do jogo"
      - "fecha o jogo aberto"
      - say: "fecha {game}"
        label: "fechar {game}"
      - say: "mata {game}"
        label: "fechar {game}"
      - say: "encerra {game}"
        label: "fechar {game}"


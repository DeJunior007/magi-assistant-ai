    label: "alternar a tela de ociosidade"
    reply: "Pronto."
    phrases:
      - "alterna a tela"
      - "troca a tela do hud"
      - say: "tela de ociosidade"
        slots: {on_off: "on"}
        label: "mostrar a tela de ociosidade"
      - say: "liga a tela de ociosidade"
        slots: {on_off: "on"}
        label: "mostrar a tela de ociosidade"
      - say: "modo ocioso"
        slots: {on_off: "on"}
        label: "mostrar a tela de ociosidade"
      - say: "tela de descanso"
        slots: {on_off: "on"}
        label: "mostrar a tela de ociosidade"
      - say: "proteção de tela"
        slots: {on_off: "on"}
        label: "mostrar a tela de ociosidade"
      - say: "desliga a tela de ociosidade"
        slots: {on_off: "off"}
        label: "mostrar o painel completo"
      - say: "painel completo"
        slots: {on_off: "off"}
        label: "mostrar o painel completo"
      - say: "mostra o painel completo"
        slots: {on_off: "off"}
        label: "mostrar o painel completo"
      - say: "mostra tudo"
        slots: {on_off: "off"}
        label: "mostrar o painel completo"


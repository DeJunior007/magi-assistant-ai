# Frases curtas frequentes do Magui (tarefa 1.12; R12.2).
#
# fixed: pré-geradas no primeiro uso do Speaker e guardadas em ~/.cache/magi/tts/.
# lazy: fixas raras (1.23); não são pré-geradas, vão para o cache na primeira vez que são faladas.
# templates: com placeholder {nome}; o texto chega já preenchido e é cacheado por valor
#            depois da primeira síntese (ex.: "Abrindo Hades." vira entrada própria).
# Toda constante SAY_* do código precisa estar aqui (tests/core/test_tts.py confere).
# A comparação ignora maiúsculas e espaços repetidos.

fixed:
  - "Beleza."
  - "Feito."
  - "Pronto."
  - "Ok."
  - "Certo."
  - "Pode falar."
  - "Fala."
  - "Tô ouvindo."
  - "Confirma?"
  - "Tem certeza?"
  - "Cancelado."
  - "Deixa pra lá, então."
  - "Não peguei, repete?"
  - "Não entendi, fala de novo?"
  - "Tô sem internet."
  - "Deu ruim aqui, tenta de novo."
  - "Não consegui fazer isso."
  - "Música pausada."
  - "Voltando a música."
  - "Pulando."
  - "Volume ajustado."
  - "Bateu o teto do mês."
  # Respostas fixas do núcleo mais comuns (1.23; RNF-04).
  - "Ainda não sei fazer isso."
  - "Isso eu ainda não sei fazer."
  - "Deu ruim aqui, não consegui."
  - "Você quis dizer isso?"
  - "Tem certeza? Diz confirma."
  - "Anotado."
  - "Deixei na tela."
  - "Guardei."
  - "Não consegui falar com a nuvem agora, tenta de novo daqui a pouco."
  - "Bati o teto do mês, só comandos locais agora."


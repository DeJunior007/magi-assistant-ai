# CI da Ayanami (Y1.4; R10.4, design §11 "Deploy").
#
# Em push no main que toque a Ayanami: testes (com Postgres descartável) → imagens no ghcr.io
# (público) → deploy no node 2 por SSH, só se o secret AYANAMI_HOST existir (job `portao`; `if:`
# não lê `secrets`). A chave AYANAMI_SSH_KEY é restrita no node 2 a um comando forçado
# (deploy/ayanami/host/ci-deploy.sh): `deploy <sha>` roda deploy.sh --tag <sha> --sem-git
# --sem-build; `saude` confere banco == "ok" na /saude. O PC não é tocado.
name: ayanami

on:
  push:
    branches: [main]
    paths:
      - "ayanami/**"
      - "magi/elo/**"
      - "magi/news/**"
      - "deploy/ayanami/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ayanami.yml"

permissions:
  contents: read

concurrency:
  group: ayanami-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Mesmo papel do `ayanami-pg-teste` local (deploy/ayanami/pg-teste.sh): porta 54340, senha
      # falsa só de teste. Nunca a 54329 nem a base `magi` (o fixture recusa).
      ayanami-pg-teste:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ayanami
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: ayanami_teste
        ports:
          - 54340:5432
        options: >-
          --health-cmd "pg_isready -U ayanami -d ayanami_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AYANAMI_TEST_DSN: postgresql://ayanami:teste@127.0.0.1:54340/ayanami_teste
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dependências de sistema (áudio, D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libdbus-1-dev
      - name: uv sync
        run: uv sync --extra ayanami
      - name: ruff
        run: uv run ruff check ayanami magi/elo magi/news tests/elo tests/ayanami tests/deploy
      - name: pytest
        run: uv run pytest -q tests/elo tests/ayanami tests/deploy

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - ml: "0"
            sufixo: ""
          - ml: "1"
            sufixo: "-ml"
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (ghcr exige minúsculas)
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ayanami" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ayanami/Dockerfile
          build-args: |
            AYANAMI_ML=${{ matrix.ml }}
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}${{ matrix.sufixo }}
            ${{ steps.nome.outputs.imagem }}:main${{ matrix.sufixo }}
          cache-from: type=gha,scope=ayanami${{ matrix.sufixo }}
          cache-to: type=gha,mode=max,scope=ayanami${{ matrix.sufixo }}

  portao:
    runs-on: ubuntu-latest
    outputs:
      tem_host: ${{ steps.ver.outputs.tem_host }}
    steps:
      - id: ver
        env:
          AYANAMI_HOST: ${{ secrets.AYANAMI_HOST }}
        run: |
          if [ -n "$AYANAMI_HOST" ]; then echo "tem_host=true"; else echo "tem_host=false"; fi >> "$GITHUB_OUTPUT"

  deploy:
    needs: [imagem, portao]
    if: github.ref == 'refs/heads/main' && needs.portao.outputs.tem_host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Um deploy por vez, nunca cancelado no meio (o seguinte espera).
    concurrency:
      group: ayanami-deploy
      cancel-in-progress: false
    steps:
      - name: deploy.sh --tag <sha> --sem-build no node 2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AYANAMI_HOST }}
          username: ${{ secrets.AYANAMI_USER }}
          key: ${{ secrets.AYANAMI_SSH_KEY }}
          command_timeout: 15m
          # Comando forçado no node 2 → deploy/ayanami/host/deploy.sh --tag ${{ github.sha }}
          # --sem-git --sem-build (depois de levar o clone a esse commit).
          script: deploy ${{ github.sha }}
      - name: Smoke /saude (banco == ok)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AYANAMI_HOST }}
          username: ${{ secrets.AYANAMI_USER }}
          key: ${{ secrets.AYANAMI_SSH_KEY }}
          # Comando forçado → curl -fsS http://127.0.0.1:8740/saude e exige banco == "ok".
          script: saude

[project]
name = "magi-assistant"
version = "0.1.0"
description = "Magui: assistente de voz PT-BR especializada em cultura pop, integrada ao MAGI Gamer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependências fixadas aqui na tarefa 0.1 para os agentes paralelos não editarem este arquivo.
# Exceção: wake word (openWakeWord) entra na tarefa 0.7/1.1, conforme o spike S4.
dependencies = [
    # comum
    "pyyaml>=6",
    "watchfiles>=0.21",
    "keyring>=25",
    "httpx>=0.27",
    # áudio e protocolo (satélite)
    "wyoming>=1.5",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pulsectl>=24.4",
    # wake word (tarefa 1.1): backend ONNX; tflite-runtime anulado em [tool.uv] (sem wheel p/ 3.12)
    "openwakeword>=0.6",
    "evdev>=1.7",
    "dbus-next>=0.2.3",
    # núcleo
    "rapidfuzz>=3.9",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # agente e provedores
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "openai>=1.40",
    "google-genai>=0.3",
    # Spotify
    "spotipy>=2.24",
    # notícias
    "feedparser>=6.0",
    "selectolax>=0.3",
    # HUD (testes do rosto e da ponte)
    "PySide6>=6.7",
    "kokoro-onnx>=0.4",
    "pymupdf>=1.28.2",
]

[project.scripts]
magi-satellite = "magi.satellite.__main__:main"
magi-core = "magi.core.service:main"
magi-ayanami = "magi.news.__main__:main"  # Ayanami: o agente de notícias
magi-news = "magi.news.__main__:main"  # nome antigo, mantido para scripts
magi-uso = "magi.maintenance.uso:main"  # métricas do PRD a partir do banco
magi-clean = "magi.maintenance.cleanup:main"
magi-keys = "magi.cli.keys:main"
magi-spotify-login = "magi.cli.spotify_login:main"
ayanami = "ayanami.cli:main"  # API central no node 2 (specs/ayanami-central, Y0.2)
magi-news-sync = "magi.elo.news_sync:main"  # PC puxa notícias da Ayanami (spec §5.2)
magi-backup = "magi.elo.backup:main"  # backup do PC para a Ayanami (spec §7.1)

[project.optional-dependencies]
# Nuvem (Ayanami, node 2). Fora do `uv sync` padrão do PC: `uv sync --extra ayanami`.
ayanami = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "procrastinate==3.10.0",
    "psycopg[pool]>=3.2",
    "mcp==2.3.0",
    "httpx>=0.27",
    "websockets>=13",
    "pywebpush==2.5.0",  # traz o py-vapid (P2.1)
]
# Pesadas da Ayanami (voz, STT, embeddings): `uv sync --extra ayanami-ml`. Testes nunca importam no topo.
ayanami-ml = [
    # kokoro-onnx/onnxruntime: as mesmas do PC (o uv.lock é um só; a spec pedia 0.4.7/1.31.0, o que
    # rebaixaria o kokoro-onnx do PC de 0.6.1). Ver Sobras da Y0.2 no tasks.md.
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.30.0",
    "faster-whisper==1.2.1",
    "fastembed==0.9.0",
]

[dependency-groups]
dev = [
    "pyte>=0.8",  # emulador VT do Konsole do HUD (hud/konsole_term.py)
    "pillow>=12.3.0",  # testes do recorte da arte da Condessa (hud/tools/condessa_build.py)
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
# openWakeWord declara tflite-runtime no Linux, mas não há wheel para Python 3.12. Usamos só o
# backend ONNX (onnxruntime já está acima), então a dependência é anulada aqui (tarefa 1.1).
override-dependencies = ["tflite-runtime; python_version < '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magi", "ayanami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"
markers = [
    "db: precisa do Postgres de desenvolvimento (deploy/docker-compose.yml)",
    "live: chama provedores reais (precisa de chaves no keyring)",
    "pg: precisa do Postgres descartável ayanami-pg-teste (AYANAMI_TEST_DSN; deploy/ayanami/pg-teste.sh)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["hud/gamerhud.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

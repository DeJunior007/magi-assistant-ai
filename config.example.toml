# Exemplo de configuração do Magui. Copie para ~/.config/magi/config.toml
# (ou aponte a variável MAGI_CONFIG para outro caminho). Recarrega ao salvar.
#
# NUNCA coloque chaves de API aqui: em [providers.*].keys vão só os NOMES.
# Guarde cada valor no chaveiro do sistema com:  magi-keys add openai-1

[providers.openai]
keys = ["openai-1", "openai-2"]        # nomes no keyring, não as chaves

[providers.gemini]
keys = ["gemini-1", "gemini-2"]
free_tier = true                        # proíbe dados pessoais (memória, voz, humor, capturas)

# Provedor e modelo de cada tarefa (medidos no spike S3, docs/spikes/S3.md, 2026-10-02).
# A voz do TTS NÃO foi escolhida: ouça as amostras em ~/Music/magi-vozes/ (modelo-voz.wav).
# Opções comuns a qualquer tarefa:
#   timeout_s = 15          tempo máximo por chamada; estouro vira erro tratável (padrão: 8 s em
#                           search, 15 s nas demais; o Gemini recebe no mínimo 10 s como prazo do
#                           servidor, e o corte abaixo disso é local)
# Opções de chat repassadas à OpenAI (agent, vision, news): temperature, top_p, reasoning_effort
# ("none"/"low"/"medium"/"high"), verbosity, max_completion_tokens, seed, parallel_tool_calls...
# Em /v1/chat/completions, gpt-5.4-mini e gpt-5.6-luna só aceitam tools com reasoning_effort =
# "none" (testado em 2026-10-02; "low" dá HTTP 400). Em search na OpenAI,
# reasoning_effort vira reasoning.effort da Responses API.
[user]
name = ""                               # como a Magui te chama (ex.: "Pedro")

[tasks]
# streaming (1.25): transcreve enquanto fala pela Realtime API (sessão de transcrição por WebSocket);
# streaming_model opcional (padrão = model; gpt-live-transcribe custa ~4x). Falhou -> áudio inteiro.
stt        = { provider = "openai", model = "gpt-transcribe", streaming = false }
tts        = { provider = "openai", model = "gpt-4o-mini-tts", voice = "<escolher ouvindo ~/Music/magi-vozes>", instructions = "Fale em português do Brasil com sotaque brasileiro natural. Voz feminina jovem, animada e brincalhona, como uma amiga gamer conversando no Discord." }
agent      = { provider = "openai", model = "gpt-5.4-mini", reasoning_effort = "none", timeout_s = 15 }
vision     = { provider = "openai", model = "gpt-5.4-mini" }  # não medido no S3 (mesmo modelo do agente)
embeddings = { provider = "openai", model = "text-embedding-3-small", dimensions = 1536 }  # = memories.embedding
search     = { provider = "gemini", model = "gemini-2.5-flash", timeout_s = 8 }  # único com Google Search na cota gratuita
# Reserva paga da pesquisa (3.8): usada quando o Gemini estoura o prazo, falha ou dá 429. Conta no
# orçamento (~US$ 0,017 por pesquisa, S3) e é recusada com o teto estourado. Apague para não usar.
search_fallback = { provider = "openai", model = "gpt-5.4-mini", timeout_s = 10 }
news       = { provider = "gemini", model = "gemini-3.5-flash-lite", embedding_model = "gemini-embedding-001", dimensions = 768 }  # = news_items.embedding
# Learning Mode (specs/learning-mode, spec §2): ações do menu de seleção (Improve/Explain/
# Translate/Vocabulary) e observações em background. Contam no orçamento (LM-006). Trocar o modelo
# é só aqui (ENG-002). Sem timeout_s: 8 s nas ações e 20 s nas observações.
learning_actions = { provider = "openai", model = "gpt-5.4-mini", reasoning_effort = "none", timeout_s = 8 }
learning_observe = { provider = "openai", model = "gpt-5.4-mini", reasoning_effort = "none", timeout_s = 20 }

[budget]
monthly_usd = 5.0                       # teto mensal; "aumenta o teto pra 8 dólares" ajusta por voz
                                        # (o ajuste fica em <data_dir>/budget_state.json; editar
                                        # este valor depois descarta o ajuste por voz)

# Preços por provedor e modelo: USD por `per` unidades de entrada (input) e de saída (output).
# Unidades: tokens (agent, vision, embeddings, search, news), segundos de áudio (stt),
# caracteres (tts). O modelo "*" vale para qualquer modelo do provedor sem entrada própria.
# `per_call` soma uma taxa fixa (USD) por chamada. Sem preço, a chamada custa 0 e o log avisa.
# Fonte: https://developers.openai.com/api/docs/pricing (acessada em 2026-10-02, tier standard).
[budget.prices.openai."gpt-5.4-mini"]
input = 0.75                            # USD por 1M tokens de entrada
output = 4.50                           # USD por 1M tokens de saída
per = 1000000

[budget.prices.openai."gpt-transcribe"]
input = 0.0045                          # USD por minuto de áudio
per = 60                                # input_units = segundos

[budget.prices.openai."gpt-live-transcribe"]  # só se for o streaming_model (1.25)
input = 0.017
per = 60

[budget.prices.openai."gpt-4o-mini-tts"]
# ESTIMATIVA, não é preço de tabela: a OpenAI cobra US$ 0,60/1M tokens de texto + US$ 12/1M tokens
# de áudio (≈ US$ 0,015/min, estimativa oficial). Convertido pela fala medida no S3 (~12,6 caracteres
# por segundo de áudio) ≈ US$ 20 por 1M caracteres.
input = 20.0                            # ESTIMATIVA: USD por 1M caracteres
per = 1000000

[budget.prices.openai."text-embedding-3-small"]
input = 0.02                            # USD por 1M tokens
per = 1000000

[budget.prices.openai."web_search"]
# Taxa da ferramenta web_search (tarefa search na OpenAI), cobrada por chamada além dos tokens:
# US$ 10 por 1k chamadas. Os tokens do conteúdo pesquisado entram no preço do modelo.
# (web_search_preview em modelo sem raciocínio: US$ 25/1k, use o modelo "web_search_preview".)
per_call = 0.01                         # USD por chamada da ferramenta

[budget.prices.gemini."*"]
input = 0.0                             # cota gratuita (free_tier = true) não passa pelo orçamento
output = 0.0
per = 1000000

[database]
# Postgres + pgvector do deploy/docker-compose.yml (só em 127.0.0.1).
dsn = "postgresql://magi:magi@127.0.0.1:54329/magi"

[paths]
data_dir  = "~/.local/share/magi"
cache_dir = "~/.cache/magi"

[conversation]
# Conversa contínua (1.20): depois de responder, a Magui fica ouvindo sem wake word e sem bip
# (rosto "ouvindo" no HUD) por followup_s para você começar a falar; silêncio = volta a dormir.
# "valeu", "só isso", "tchau"... dispensam na hora. Desligada em call no Discord (só PTT).
followup   = true
followup_s = 3.0

[speech]
# Idioma em que a Condessa FALA (legenda, voz e avisos); você continua falando português.
# "pt-br" (padrão) = como sempre. "en-gb" = inglês britânico: as frases fixas do código são
# traduzidas pela tabela magi/core/i18n/en-gb.yaml (frase sem entrada sai em português e vai ao
# log como "sem tradução") e o agente e o Rádio Ayanami passam a responder em inglês.
# Ajuste também tasks.tts.instructions (sotaque/idioma da voz). Exige reiniciar o núcleo.
language = "pt-br"

[learning]
# Condessa Learning Mode (specs/learning-mode, spec §2). Toda chave tem padrão; apague a seção
# para usar os valores abaixo.
enabled           = true
level             = "B2"            # A1..C2; manual no MVP (LM-009), aparece como "B2 · CONVERSATION"
track             = "CONVERSATION"
explain_language  = "en"            # "en" | "pt-br": idioma de Improve/Explain/Vocabulary (LM-008)
translate_to      = "pt-br"         # idioma do Translate (TRA-001)
speak_replies     = true            # a Condessa fala a resposta (LM-004)
idle_end_min      = 20              # minutos sem mensagem até encerrar a sessão
observe           = true            # observações em background (Fase 4)
observe_daily_max = 200             # teto de chamadas de observação por dia (LM-006)
storage           = "postgres"      # "postgres" | "jsonl"
default_topic     = "free"          # tema inicial: free | interview | game | news (LM-013)
topic_picker_s    = 10              # segundos até o seletor de tema fechar sozinho
summary_show_s    = 60              # segundos do cartão LAST SESSION depois de sair (LM-011)
max_session_min   = 180             # sessão aberta há mais que isso fecha sozinha (watchdog)
# Container local das observações (deploy/docker-compose.yml, serviço qwen). Vazio = sem
# container; "magi-qwen" = o núcleo dá docker start ao abrir a sessão e docker stop ao fechar.
local_container   = ""
local_url         = "http://127.0.0.1:11435"
local_model       = "qwen-learning"
local_start_timeout_s = 60          # espera do Ollama subir; passou disso, segue sem observações

[satellite]
# Fim de fala (1.26), lido ao iniciar o satélite. Corta cedo demais? Aumente end_silence_ms.
end_silence_ms    = 1000   # silêncio que encerra a frase
min_speech_ms     = 240    # voz seguida mínima para contar como fala (estalos não contam)
vad_threshold     = 0.5    # nota do Silero para "tem voz"; voz baixa/longe: 0.4
wake_no_speech_ms = 5000   # após o "Condessa", desiste se ninguém falar
preroll_ms        = 400    # áudio anterior à ativação enviado junto

[debug]
# save_audio = true grava cada fala enviada ao STT em ~/.cache/magi/utterances/ (as 50 últimas).
save_audio = false

[alerts]
# Avisos proativos (R15.1, R15.2): fala curta + card fora de call; em call, só na tela.
enabled            = true
poll_s             = 12          # intervalo de leitura do sysfs (s)
cooldown_s         = 900         # mínimo entre dois avisos iguais (s)
cpu_warn_c         = 90          # CPU (hwmon k10temp/coretemp/zenpower, temp1)
cpu_clear_c        = 82          # histerese: só avisa de novo depois de esfriar abaixo disto
gpu_warn_c         = 95          # GPU (hwmon amdgpu, temp2 = junção)
gpu_clear_c        = 85
battery_pct        = 15          # controle (power_supply com scope=Device, ex. DualSense)
battery_clear_pct  = 20          # (ou carregando)
cost               = true        # 80% e 100% do teto de [budget], uma vez por mês
disk               = true        # uso do SSD: avisa em disk_warn_pct e de novo em disk_crit_pct
disk_paths         = ["/"]
disk_warn_pct      = 85
disk_crit_pct      = 95
cleanup_announce_gb = 0.5        # a faxina diária (magi-clean) só vira aviso se liberou isto

[cleanup]
# Faxina diária do Docker (magi-clean.timer, 04:30): cache de build e imagens órfãs; nunca volumes.
enabled        = true
keep_hours     = 168             # cache de build mais novo que isso fica
aggressive_pct = 90              # disco acima disso: limpa todo o cache de build
path           = "/"

[news.delivery]
# Entrega de notícias pelo núcleo (6.10, R19.5, R19.6): bomba = frase + card (voz só fora de
# call), alta = só card. Precisa do Postgres. "Sugere, não sempre": limites abaixo.
enabled       = true
poll_s        = 300          # intervalo entre leituras dos itens não entregues (s)
max_per_hour  = 2            # entregas por hora (bombas ignoram este limite)
max_per_day   = 8            # entregas por 24 h (vale para todas)
max_age_h     = 48           # mais velho que isso: descartado sem aviso
batch         = 5            # itens lidos por rodada

[news.feedback]
# Retorno das notícias (6.11, R19.7, R19.8): mexe no peso da obra (franchise_prefs.weight, 0..1).
step          = 0.25         # "não curti" / "mais disso" (sobre a última notícia entregue)
ignored_step  = 0.1          # queda quando a obra é ignorada ignored_after vezes seguidas
ignored_after = 3
grace_h       = 2            # entrega mais nova que isso ainda não conta como ignorada
recent_h      = 6            # "não curti" vale para a notícia entregue até essas horas atrás
max_age_h     = 48           # igual a [news.delivery] max_age_h
